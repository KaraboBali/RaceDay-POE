name: RaceDay API CI

on:
  push:
    branches: [ part2-api, main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore Part2-API/RaceDay.sln

      - name: Build
        run: dotnet build Part2-API/RaceDay.sln --no-restore --configuration Release

      - name: Run unit tests
        run: dotnet test Part2-API/RaceDay.sln --no-build --configuration Release --verbosity normal